[package]
name = "vidsnatch-api"
version = "1.0.0"
edition = "2021"

[dependencies]
axum             = { version = "0.7", features = ["ws", "multipart"] }
tokio            = { version = "1",   features = ["full"] }
tower            = { version = "0.4", features = ["full"] }
tower-http       = { version = "0.5", features = ["cors", "compression-gzip", "trace"] }
serde            = { version = "1",   features = ["derive"] }
serde_json       = "1"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid             = { version = "1",   features = ["v4", "serde"] }
chrono           = { version = "0.4", features = ["serde"] }
reqwest          = { version = "0.11", features = ["json", "stream", "socks"] }
futures          = "0.3"
tokio-util       = { version = "0.7", features = ["io"] }
tokio-stream     = { version = "0.1", features = ["sync"] }
regex            = "1"
url              = "2"
anyhow           = "1"
thiserror        = "1"
hex              = "0.4"
base64           = "0.21"
hmac             = "0.12"
sha2             = "0.10"
aes-gcm          = "0.10"
rand             = "0.8"
once_cell        = "1"

sqlx             = { version = "0.7", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
argon2           = "0.5"
jsonwebtoken     = "9"
bcrypt           = "0.15"
async-stripe     = { version = "0.34", features = ["checkout", "webhook-events"] }
aws-sdk-s3       = "1"
aws-config       = "1"
lettre           = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-native-tls", "builder"] }

[profile.release]
opt-level       = 3
lto             = true
codegen-units   = 1
panic           = "abort"
strip           = true
